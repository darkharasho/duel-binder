name: Catalog

# Refreshes the card catalog the way the desktop app does and uploads what changed to the portal.
# work.sqlite is cached after every run so a long first sync resumes; base.sqlite (the last
# snapshot the portal accepted) is cached only after a successful upload.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Upload every row, ignoring the last uploaded snapshot
        type: boolean
        default: false
      allow_shrink:
        description: Upload even if a table loses more than 2% of its rows (check upstream first)
        type: boolean
        default: false
      refresh_sets:
        description: Re-read the non-English set lists and Pokémon set art now instead of on their weekly timers
        type: boolean
        default: false
      refresh_cards:
        description: Read the YGOPRODeck card list and TCGplayer catalog now instead of on their daily and weekly timers
        type: boolean
        default: false

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
      PORTAL_ADMIN_TOKEN: ${{ secrets.PORTAL_ADMIN_TOKEN }}
    steps:
      - name: Check portal settings
        run: |
          if [ -z "$PORTAL_URL" ] || [ -z "$PORTAL_ADMIN_TOKEN" ]; then
            echo "::error::Set the PORTAL_URL repository variable and the PORTAL_ADMIN_TOKEN secret"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall rebuilds better-sqlite3 for Electron, which the job runs under.
      - name: Install
        run: npm ci
      - name: Restore work database
        uses: actions/cache/restore@v4
        with:
          # The WAL too: a run cut off by the timeout keeps the batches it saved.
          path: |
            catalog-work/work.sqlite
            catalog-work/work.sqlite-wal
            catalog-work/fingerprints.sqlite
            catalog-work/fingerprints-pkm.sqlite
            catalog-work/pokemon-src.sqlite
            catalog-work/pokemon-src.sqlite-wal
          key: catalog-work-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-work-
      # Its own cache: a cache is matched on its exact path list, so adding a file to the work
      # database's list would orphan every saved work database (a from-scratch rebuild then
      # trips the shrink guard). Never change that list without a plan to carry the old one over.
      - name: Restore printing photo skip list
        uses: actions/cache/restore@v4
        with:
          path: catalog-work/thumbs-skip.json
          key: catalog-thumbs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-thumbs-
      # Its own cache: adding these files to the work database's path list would orphan every saved
      # work database (see above), so that list stays exactly as it is.
      - name: Restore One Piece sources
        uses: actions/cache/restore@v4
        with:
          path: |
            catalog-work/onepiece-src.sqlite
            catalog-work/onepiece-src.sqlite-wal
          key: catalog-onepiece-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-onepiece-
      # The Japanese One Piece sources: their own cache too, so the English list above stays as it is.
      # The key doesn't start with catalog-onepiece-, so neither restore can pick the other's.
      - name: Restore One Piece Japanese sources
        uses: actions/cache/restore@v4
        with:
          path: |
            catalog-work/onepiece-ja-src.sqlite
            catalog-work/onepiece-ja-src.sqlite-wal
          key: catalog-opja-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-opja-
      # One Piece's fingerprint hashes: their own cache, for the same reason.
      - name: Restore One Piece fingerprints
        uses: actions/cache/restore@v4
        with:
          path: catalog-work/fingerprints-op.sqlite
          key: catalog-fpop-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-fpop-
      # Magic's fingerprint hashes: their own cache too (catalog-fpmtg, not catalog-mtg's prefix).
      - name: Restore Magic fingerprints
        uses: actions/cache/restore@v4
        with:
          path: catalog-work/fingerprints-mtg.sqlite
          key: catalog-fpmtg-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-fpmtg-
      # Magic's set stats: their own cache, for the same reason (nothing starts with catalog-mtg elsewhere).
      - name: Restore Magic sources
        uses: actions/cache/restore@v4
        with:
          path: |
            catalog-work/magic-src.sqlite
            catalog-work/magic-src.sqlite-wal
          key: catalog-mtg-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-mtg-
      - name: Restore base snapshot
        uses: actions/cache/restore@v4
        with:
          path: catalog-work/base.sqlite
          key: catalog-base-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-base-
      # One step per stage so the admin page can show each one's time. A problem only fails the run
      # at "Check for problems", so it doesn't stop the stages after it.
      - name: Refresh Yu-Gi-Oh
        run: >-
          npm run catalog:job -- --stage ygo
          ${{ inputs.refresh_sets && '--refresh-sets' || '' }}
          ${{ inputs.refresh_cards && '--refresh-cards' || '' }}
      - name: Refresh Pokémon
        run: npm run catalog:job -- --stage pokemon
      # Bounded and never blocks the upload: a hang or crash here still lets Yu-Gi-Oh and Pokémon
      # upload, and the next step turns the night red.
      - name: Refresh One Piece
        id: onepiece
        timeout-minutes: 90
        continue-on-error: true
        run: npm run catalog:job -- --stage onepiece
      - name: Flag a failed One Piece step
        if: steps.onepiece.outcome == 'failure'
        run: echo "CATALOG_PROBLEMS=1" >> "$GITHUB_ENV"
      # Streams Scryfall's whole all_cards file (every language, about 400 MB gzipped). Bounded and never blocks the upload.
      - name: Refresh Magic
        id: magic
        timeout-minutes: 90
        continue-on-error: true
        run: npm run catalog:job -- --stage magic
      - name: Flag a failed Magic step
        if: steps.magic.outcome == 'failure'
        run: echo "CATALOG_PROBLEMS=1" >> "$GITHUB_ENV"
      - name: Upload catalog
        run: >-
          npm run catalog:job -- --stage upload
          ${{ inputs.full && '--full' || '' }}
          ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
      - name: Yu-Gi-Oh fingerprints
        run: npm run catalog:job -- --stage fingerprints-ygo
      - name: Pokémon fingerprints
        run: npm run catalog:job -- --stage fingerprints-pkm
      # Bounded: the first nights download every Bandai picture (hashes kept as they go), and no app
      # scans One Piece yet, so a slow night only turns the run red.
      - name: One Piece fingerprints
        id: fingerprints-op
        timeout-minutes: 60
        continue-on-error: true
        run: npm run catalog:job -- --stage fingerprints-op
      - name: Flag failed One Piece fingerprints
        if: steps.fingerprints-op.outcome == 'failure'
        run: echo "CATALOG_PROBLEMS=1" >> "$GITHUB_ENV"
      # Bounded likewise: the first nights hash up to 20k Scryfall images each (kept as they go),
      # and no app scans Magic yet.
      - name: Magic fingerprints
        id: fingerprints-mtg
        timeout-minutes: 60
        continue-on-error: true
        run: npm run catalog:job -- --stage fingerprints-mtg
      - name: Flag failed Magic fingerprints
        if: steps.fingerprints-mtg.outcome == 'failure'
        run: echo "CATALOG_PROBLEMS=1" >> "$GITHUB_ENV"
      # Small copies of the printing photos stored since last night, for grids. Its own step, and
      # never fails the run: without them the grids show the full photos, as before.
      - name: Printing photo small copies
        continue-on-error: true
        run: npm run catalog:thumbs
      - name: Check for problems
        run: test -z "$CATALOG_PROBLEMS"
      - name: Parity check
        continue-on-error: false
        run: npm run catalog:parity
      - name: Save work database
        if: always()
        uses: actions/cache/save@v4
        with:
          # The WAL too: a run cut off by the timeout keeps the batches it saved.
          path: |
            catalog-work/work.sqlite
            catalog-work/work.sqlite-wal
            catalog-work/fingerprints.sqlite
            catalog-work/fingerprints-pkm.sqlite
            catalog-work/pokemon-src.sqlite
            catalog-work/pokemon-src.sqlite-wal
          key: catalog-work-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save printing photo skip list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: catalog-work/thumbs-skip.json
          key: catalog-thumbs-${{ github.run_id }}-${{ github.run_attempt }}
      # Its own cache, not the work database's (see "Restore One Piece sources").
      - name: Save One Piece sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            catalog-work/onepiece-src.sqlite
            catalog-work/onepiece-src.sqlite-wal
          key: catalog-onepiece-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save One Piece Japanese sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            catalog-work/onepiece-ja-src.sqlite
            catalog-work/onepiece-ja-src.sqlite-wal
          key: catalog-opja-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save One Piece fingerprints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: catalog-work/fingerprints-op.sqlite
          key: catalog-fpop-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Magic fingerprints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: catalog-work/fingerprints-mtg.sqlite
          key: catalog-fpmtg-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Magic sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            catalog-work/magic-src.sqlite
            catalog-work/magic-src.sqlite-wal
          key: catalog-mtg-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save base snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: catalog-work/base.sqlite
          key: catalog-base-${{ github.run_id }}-${{ github.run_attempt }}

name: Catalog

# Refreshes the card catalog the way the desktop app does and uploads what changed to the portal.
# work.sqlite is cached after every run so a long first sync resumes; base.sqlite (the last
# snapshot the portal accepted) is cached only after a successful upload.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Upload every row, ignoring the last uploaded snapshot
        type: boolean
        default: false
      allow_shrink:
        description: Upload even if a table loses more than 2% of its rows (check upstream first)
        type: boolean
        default: false
      refresh_sets:
        description: Re-read the non-English set lists and Pokémon set art now instead of on their weekly timers
        type: boolean
        default: false
      refresh_cards:
        description: Read the YGOPRODeck card list now instead of on its daily timer
        type: boolean
        default: false

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
      PORTAL_ADMIN_TOKEN: ${{ secrets.PORTAL_ADMIN_TOKEN }}
    steps:
      - name: Check portal settings
        run: |
          if [ -z "$PORTAL_URL" ] || [ -z "$PORTAL_ADMIN_TOKEN" ]; then
            echo "::error::Set the PORTAL_URL repository variable and the PORTAL_ADMIN_TOKEN secret"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall rebuilds better-sqlite3 for Electron, which the job runs under.
      - name: Install
        run: npm ci
      - name: Restore work database
        uses: actions/cache/restore@v4
        with:
          # The WAL too: a run cut off by the timeout keeps the batches it saved.
          path: |
            catalog-work/work.sqlite
            catalog-work/work.sqlite-wal
            catalog-work/fingerprints.sqlite
            catalog-work/fingerprints-pkm.sqlite
            catalog-work/pokemon-src.sqlite
            catalog-work/pokemon-src.sqlite-wal
          key: catalog-work-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-work-
      - name: Restore base snapshot
        uses: actions/cache/restore@v4
        with:
          path: catalog-work/base.sqlite
          key: catalog-base-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-base-
      # One step per stage so the admin page can show each one's time. A problem only fails the run
      # at "Check for problems", so it doesn't stop the stages after it.
      - name: Refresh Yu-Gi-Oh
        run: >-
          npm run catalog:job -- --stage ygo
          ${{ inputs.refresh_sets && '--refresh-sets' || '' }}
          ${{ inputs.refresh_cards && '--refresh-cards' || '' }}
      - name: Refresh Pokémon
        run: npm run catalog:job -- --stage pokemon
      - name: Upload catalog
        run: >-
          npm run catalog:job -- --stage upload
          ${{ inputs.full && '--full' || '' }}
          ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
      - name: Yu-Gi-Oh fingerprints
        run: npm run catalog:job -- --stage fingerprints-ygo
      - name: Pokémon fingerprints
        run: npm run catalog:job -- --stage fingerprints-pkm
      - name: Check for problems
        run: test -z "$CATALOG_PROBLEMS"
      - name: Parity check
        continue-on-error: false
        run: npm run catalog:parity
      - name: Save work database
        if: always()
        uses: actions/cache/save@v4
        with:
          # The WAL too: a run cut off by the timeout keeps the batches it saved.
          path: |
            catalog-work/work.sqlite
            catalog-work/work.sqlite-wal
            catalog-work/fingerprints.sqlite
            catalog-work/fingerprints-pkm.sqlite
            catalog-work/pokemon-src.sqlite
            catalog-work/pokemon-src.sqlite-wal
          key: catalog-work-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save base snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: catalog-work/base.sqlite
          key: catalog-base-${{ github.run_id }}-${{ github.run_attempt }}

name: iOS

# Builds the iOS app (capacitor.config.ts) on a release tag and uploads it to App Store Connect,
# where it shows up in TestFlight. Without the App Store Connect secrets it only checks that the
# app compiles, for the simulator, unsigned. Pull requests that touch the app get the same check.
#
# Secrets (App Store Connect > Users and Access > Integrations > App Store Connect API, an
# Admin key so Xcode can create the distribution certificate and profile itself):
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY (the .p8 file's
#   text) and APPLE_TEAM_ID.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'vite.phone.config.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    env:
      PROJECT: ios/App/App.xcodeproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The iOS build needs no Electron or native Node modules, which postinstall fetches.
      - run: npm ci --ignore-scripts
      - name: Build the web files and copy them into the Xcode project
        run: npm run build:ios

      - name: Check for signing secrets
        id: secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY" ] && [ -n "$TEAM_ID" ] \
            && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::warning::App Store Connect secrets aren't set: building for the simulator only, nothing is uploaded."
            fi
          fi

      - name: Compile for the simulator (unsigned)
        if: steps.secrets.outputs.sign == 'false'
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive, sign and upload to App Store Connect
        if: steps.secrets.outputs.sign == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID")
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"

          # Archive unsigned and sign only at export (distribution, cloud-managed): signing the
          # archive made a new Apple Development certificate on every fresh runner until the
          # account hit Apple's certificate limit.
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"

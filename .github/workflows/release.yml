name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "refs/tags/v${VERSION}" != "${GITHUB_REF}" ]; then
            echo "::error::Tag ${GITHUB_REF} does not match package.json version v${VERSION}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes -R "$GITHUB_REPOSITORY"

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        # CSC_LINK is read at build time (electron.vite.config.ts bakes __MAC_SIGNED__)
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
        run: npx electron-vite build
      # Windows is signed with Azure Artifact Signing (win.azureSignOptions in
      # electron-builder.yml). Without these electron-builder can't authenticate,
      # so fail before the slow build instead of after it.
      - name: Check the Windows signing secrets are set
        if: runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (see README.md, Release)."; exit 1; }
          done
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.os == 'windows-latest' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.os == 'windows-latest' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.os == 'windows-latest' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          EXTRA=()
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              # no signing secrets: ad-hoc sign, skip notarization
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              # hardened runtime without a real identity would block loading unsigned native libs
              EXTRA=(-c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false)
            fi
          fi
          npx electron-builder --publish always "${EXTRA[@]}"
      # The release stays a draft if this fails, since publish-release needs every build.
      - name: Verify the Windows installer is signed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -like '*-setup.exe' }
          if (-not $files) { Write-Error "No installer found in dist/"; exit 1 }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"

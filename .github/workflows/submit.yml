name: Submit

# Brings the App Store to the newest iOS build (scripts/asc-submit.py). Store releases are for native
# changes; web-only changes go out as live updates (ota.yml).
#
# Every hour it reconciles (asc-submit.py reconcile), as release tags do (ios.yml, app-store-review):
# the newest build that reached App Store Connect (newest native/ios/<NAME+NUMBER> tag) goes to review
# unless that version is already live, approved, waiting or in review, or was rejected. An older
# version in flight is pulled only when live installs already get everything in it as updates; one
# Apple is reviewing, one that has to be reviewed (scripts/review-required.sh: its phone shell differs
# from the live version's, checked with scripts/native-check.sh), or one approved but not released
# yet (manual release) stays, and the newest build waits in TestFlight until it's live. So releases
# ship at once (live updates, desktop) and the App Store catches up to them eventually.
#
#   gh workflow run submit.yml                                  # status only: versions, reviews, builds
#   gh workflow run submit.yml -f reconcile=true                # what the hourly run does, now
#   gh workflow run submit.yml -f release=latest -f whats_new="…" -f submit=true
#
# A manual submit is plain asc-submit.py submit: replace_waiting pulls an older version that's waiting
# for review or in review (even one that has to be reviewed) so this one takes its place.
#
# Secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      reconcile:
        description: 'Reconcile: submit the newest build unless the App Store is already on it (ignores the rest)'
        type: boolean
        default: false
      release:
        description: 'Build to submit (NAME+NUMBER, e.g. 0.112.0+190) or latest'
        default: 'latest'
      whats_new:
        description: "What's New text (needed when the version has none yet)"
        default: ''
      submit:
        description: 'Submit for review (off: only show status)'
        type: boolean
        default: false
      replace_waiting:
        description: "Pull an older version that's waiting for review or in review"
        type: boolean
        default: false

# One App Store change at a time (ios.yml's app-store-review uses the same group).
concurrency:
  group: app-store-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_ID: com.darkharasho.duelbinder
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # scripts/review-required.sh: what can't reach the App Store's live version as an update
      NATIVE_TAG_PREFIX: native
      NATIVE_CHECK: scripts/native-check.sh
    steps:
      - uses: actions/checkout@v4
      # native-check.sh runs scripts/live-update/fingerprint.ts with tsx; it needs nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tsx
        if: ${{ github.event_name == 'schedule' || inputs.reconcile }}
        run: npm install -g tsx@4
      - name: Write the App Store Connect key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          [ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
            || { echo "::error::App Store Connect secrets aren't set."; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          (umask 077; printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8")
      - name: Reconcile
        if: ${{ github.event_name == 'schedule' || inputs.reconcile }}
        run: |
          # Only the newest tag (by build number), without native-release-targets.sh's App Store lookup.
          RELEASE="$(git ls-remote --tags origin 'refs/tags/native/ios/*' \
            | sed -nE 's#^.*refs/tags/native/ios/([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$#\1#p' | sort -t+ -k2,2n | tail -1)"
          if [ -z "$RELEASE" ]; then
            echo "::notice::No native/ios/* tag yet (no build has reached App Store Connect through ios.yml since tags began); nothing to reconcile."
            exit 0
          fi
          echo "Newest iOS build: $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/asc-submit.py reconcile "$BUNDLE_ID" "$RELEASE" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Status
        if: ${{ github.event_name != 'schedule' && !inputs.reconcile && !inputs.submit }}
        run: python3 scripts/asc-submit.py status "$BUNDLE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Submit for review
        if: ${{ github.event_name != 'schedule' && !inputs.reconcile && inputs.submit }}
        env:
          RELEASE: ${{ inputs.release }}
          WHATS_NEW: ${{ inputs.whats_new }}
          REPLACE: ${{ inputs.replace_waiting }}
        run: |
          if [ "$RELEASE" = latest ]; then
            RELEASE="$(scripts/native-release-targets.sh ios)"
          fi
          args=(submit "$BUNDLE_ID" "$RELEASE")
          [ -n "$WHATS_NEW" ] && args+=(--whats-new "$WHATS_NEW")
          [ "$REPLACE" = true ] && args+=(--replace-waiting)
          python3 scripts/asc-submit.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

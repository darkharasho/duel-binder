name: Search terms

# Monthly harvest of search-term proposals: reads eBay listing titles for the priciest recent
# English printings, has Claude keep the phrases collectors use, and posts them to the portal as
# pending terms for the owner to approve in the Admin Terms tab. Run it by hand with mode
# `backfill` (and a `from` offset) to work through older sets; dry run prints instead of posting.

on:
  schedule:
    - cron: '41 8 3 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: recent = sets 21 to 112 days old; backfill = every set, by price rank from `from`
        type: choice
        options: [recent, backfill]
        default: recent
      from:
        description: First price rank to harvest (backfill only)
        type: string
        default: '0'
      count:
        description: Printings to look up (one eBay call each)
        type: string
        default: '300'
      dry_run:
        description: Ask Claude but print the proposals instead of posting them
        type: boolean
        default: false

concurrency:
  group: terms
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
      PORTAL_ADMIN_TOKEN: ${{ secrets.PORTAL_ADMIN_TOKEN }}
      EBAY_PRICES_URL: ${{ vars.EBAY_PRICES_URL }}
      HARVEST_TOKEN: ${{ secrets.HARVEST_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODE: ${{ inputs.mode || 'recent' }}
      FROM: ${{ inputs.from || '0' }}
      COUNT: ${{ inputs.count || '300' }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - name: Check settings
        run: |
          for name in PORTAL_URL PORTAL_ADMIN_TOKEN EBAY_PRICES_URL HARVEST_TOKEN ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository secret or variable"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall rebuilds better-sqlite3 for Electron, which the job runs under.
      - name: Install
        run: npm ci
      - name: Harvest
        run: npm run terms:harvest -- --mode "$MODE" --from "$FROM" --count "$COUNT" $DRY_RUN

appId: com.darkharasho.yugiohcollectiontracker
productName: Duel Binder
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs,tests,.github,.superpowers}/**'
  - '!{scripts,catalog-work,out/catalog}/**'
  - '!*.tsbuildinfo'
  - '!{components.json,vitest.config.mts}'
asarUnpack:
  - resources/**
  - '**/*.node'
  # tesseract reads its WebAssembly core and language data from disk.
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/**
win:
  target: nsis
  executableName: duel-binder
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # better-sqlite3 ships identical prebuilds for every platform in both arch builds;
  # keep them as-is when merging the universal app (picked at runtime by process.arch).
  x64ArchFiles: "**/node_modules/better-sqlite3/prebuilds/*.node"
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: darkharasho
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: darkharasho
  repo: duel-binder
  releaseType: draft

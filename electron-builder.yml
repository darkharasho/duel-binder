appId: com.darkharasho.yugiohcollectiontracker
productName: Yugioh Collection Tracker
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs,tests,.github,.superpowers}/**'
  - '!*.tsbuildinfo'
  - '!{components.json,vitest.config.mts}'
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  target: nsis
  executableName: yugioh-collection-tracker
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: darkharasho
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: darkharasho
  repo: yugioh-collection-tracker
  releaseType: draft

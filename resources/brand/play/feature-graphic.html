<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1024px;height:500px;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;color:#ecebe8;background:#0c0d10}
#fg{position:relative;width:1024px;height:500px;overflow:hidden;
 background:radial-gradient(620px 460px at 0% 0%,#3a2a6b 0%,transparent 62%),radial-gradient(560px 480px at 100% 100%,#5a3a10 0%,transparent 60%),#0c0d10}
.brand{position:absolute;left:84px;top:50%;transform:translateY(-50%)}
.brand img{width:96px;height:96px;display:block;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.brand h1{margin-top:28px;font-size:68px;font-weight:600;letter-spacing:-1.5px;line-height:1}
.brand p{margin-top:16px;font-size:26px;color:#a9a7b3;line-height:1.35}
.fan{position:absolute;right:40px;top:0;width:470px;height:500px}
.card{position:absolute;width:190px;height:277px;border-radius:12px;box-shadow:0 24px 50px rgba(0,0,0,.6)}
.card .art{position:absolute;left:9%;right:9%;top:16%;height:48%;border-radius:4px}
.card .nm{position:absolute;left:8%;right:8%;top:5%;height:8%;border-radius:3px;background:rgba(255,255,255,.18)}
.card .tx{position:absolute;left:8%;right:8%;top:69%;bottom:6%;border-radius:3px;background:rgba(255,250,235,.75)}
.c1{background:linear-gradient(160deg,#e05a35,#9c2a18)}
.c1 .art{background:radial-gradient(circle at 35% 30%,#ffd27a,#e0672b 35%,#5a1712 75%)}
.c2{background:linear-gradient(160deg,#3d7bd8,#1d3f86)}
.c2 .art{background:radial-gradient(circle at 60% 40%,#bff3ff,#3aa0d8 35%,#14254f 80%)}
.c3{background:linear-gradient(160deg,#2f9e6a,#16573a)}
.c3 .art{background:radial-gradient(circle at 40% 60%,#d8ffb0,#4fb35a 35%,#123a22 80%)}
.c4{background:linear-gradient(160deg,#8c55d6,#4a2588)}
.c4 .art{background:radial-gradient(circle at 50% 35%,#ffe3ff,#b46ae0 35%,#2a1250 80%)}
.foil::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 45%,rgba(160,220,255,.22) 52%,transparent 65%)}
.price{position:absolute;right:6px;top:64px;padding:10px 16px;border-radius:14px;background:rgba(20,21,26,.88);border:1px solid #2c2d34;font-family:'IBM Plex Mono',monospace;font-size:22px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.price b{color:#6fdc8c;font-weight:500}
</style></head><body>
<div id="fg">
 <div class="brand">
  <img src="../square.svg" alt="">
  <h1>Duel Binder</h1>
  <p>Scan, sort and price<br>your card collection</p>
 </div>
 <div class="fan">
  <div class="card c3" style="left:10px;top:150px;transform:rotate(-18deg)"><div class="nm"></div><div class="art"></div><div class="tx"></div></div>
  <div class="card c2" style="left:95px;top:105px;transform:rotate(-7deg)"><div class="nm"></div><div class="art"></div><div class="tx"></div></div>
  <div class="card c4" style="left:180px;top:100px;transform:rotate(5deg)"><div class="nm"></div><div class="art"></div><div class="tx"></div></div>
  <div class="card c1 foil" style="left:265px;top:135px;transform:rotate(16deg)"><div class="nm"></div><div class="art"></div><div class="tx"></div></div>
  <div class="price">Ember Wyrm <b>$412.00</b></div>
 </div>
</div>
</body></html>

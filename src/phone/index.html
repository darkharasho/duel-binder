<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111113" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Duel Binder" />
    <!-- "default", not black-translucent: iOS 26 sizes a black-translucent home-screen app short
         by the status bar and never paints the strip left at the bottom (WebKit bug 301108). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Duel Binder</title>
    <!-- The page's CSP is the portal's header (PHONE_CSP); it has no meta tag. -->
    <link rel="manifest" href="/scan/manifest.webmanifest" vite-ignore />
    <link rel="icon" href="/favicon.ico" sizes="48x48" vite-ignore />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" vite-ignore />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

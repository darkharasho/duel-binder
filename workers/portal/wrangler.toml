name = "duel-binder-portal"
main = "src/index.ts"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "duelbinder.com", custom_domain = true },
  { pattern = "www.duelbinder.com", custom_domain = true },
  { pattern = "app.duelbinder.com", custom_domain = true }
]

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
# Keep asset paths literal. By default Workers Assets redirects or rewrites .html URLs
# (it strips the extension), which would break /app/web.html for both home() and direct requests.
html_handling = "none"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "duel-binder-images"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[vars]
SITE_URL = "https://duelbinder.com"
PUBLIC_URL = "https://app.duelbinder.com"
DISCORD_CLIENT_ID = "1563797080420655266"

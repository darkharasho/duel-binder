name = "duel-binder-portal"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# AsyncLocalStorage, so each request's database rows are counted against it (src/meter.ts).
compatibility_flags = ["nodejs_als"]

routes = [
  { pattern = "duelbinder.com", custom_domain = true },
  { pattern = "www.duelbinder.com", custom_domain = true },
  { pattern = "app.duelbinder.com", custom_domain = true }
]

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
# Keep asset paths literal. By default Workers Assets redirects or rewrites .html URLs
# (it strips the extension), which would break /app/web.html for both home() and direct requests.
html_handling = "none"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "duel-binder-images"

# The price alarm calls the eBay price Worker through this binding (a plain fetch to its workers.dev URL from
# a Worker on the same account can fail with error 1042). PRICE_WORKER_URL below stays the URL base.
[[services]]
binding = "PRICES"
service = "ygo-ebay-prices"

# Email Sending (sign-in codes). Only this sender address may be used. The domain must be onboarded in Email Sending.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["no-reply@duelbinder.com"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[vars]
SITE_URL = "https://duelbinder.com"
PUBLIC_URL = "https://app.duelbinder.com"
DISCORD_CLIENT_ID = "1563797080420655266"
PRICE_WORKER_URL = "https://ygo-ebay-prices.project96.workers.dev"
# The Play opt-in link the beta's "you're in" email sends Android testers (internal test for now).
BETA_ANDROID_OPTIN_URL = "https://play.google.com/apps/internaltest/4699025211362629714"
# iPhone beta signups go straight into this TestFlight group through the App Store Connect API
# (src/testflight.ts). The key is the "Portal beta invites" App Manager key; its .p8 is the ASC_KEY
# secret (1Password: "Duel Binder – App Store Connect API key (Portal beta invites)").
ASC_ISSUER_ID = "31d02fe9-fe2e-4b7e-acf1-4b3e8929af44"
ASC_KEY_ID = "5LKHU2NU23"
ASC_BETA_GROUP_ID = "b632be18-40e9-4ec3-8666-0b88408fe581"
# Set with the closed test's opt-in link once Play approves it: Android signups are then emailed
# this group's join link straight away (anyone can join; it is the closed test's tester list).
# BETA_ANDROID_GROUP_URL = ""
# The Chinese Pokémon eBay sweep's Browse calls a day; "0" is off (see src/pokemonSweep.ts).
POKEMON_SWEEP_DAILY_CALLS = "100"
# The Japanese One Piece eBay sweep's Browse calls a day; "0" is off (see src/onePieceSweep.ts). It shares
# the 2000-a-day sweep budget, after Yu-Gi-Oh and Pokémon, and needs the price Worker's /v1/onepiece-listings.
ONEPIECE_SWEEP_DAILY_CALLS = "60"
# The only account the /admin dashboard opens for (.harasho). Not a secret: it only names who.
ADMIN_DISCORD_ID = "201537071804973056"
# Email + password sign-in: "off" hides it; "on" turns it on once Email Sending works (see README, Email sign-in).
EMAIL_SIGN_IN = "on"
# Supporter subscriptions (src/supporters.ts, src/stripe.ts). "on" opens checkout; anything else hides it, and
# existing supporters keep their badge. The Price ids are the $3/month and $25/year Prices in Stripe. The secrets
# STRIPE_SECRET_KEY (a restricted rk_ key: Customers, Checkout Sessions, Subscriptions, Customer portal) and
# STRIPE_WEBHOOK_SECRET are set with `wrangler secret put` and kept in 1Password Private. Sandbox keys first.
SUPPORTER_ENABLED = "on"
# Live Prices (product prod_Vdf2kVDGStMz5K "Duel Binder Supporter"); the sandbox ones are in the main .env.
STRIPE_PRICE_MONTH = "price_1UcNihBpiN8YF7XpxJz0v6mp"
STRIPE_PRICE_YEAR = "price_1UcNihBpiN8YF7Xpi34V8oeD"

# Workers Logs: request logs and console output, searchable in the dashboard for a few days.
[observability]
enabled = true
